[package]
name = "freehm"
description = "FreeHM — lightweight hardware statistics overlay for games"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "freehm"
path = "src/main.rs"

[dependencies]
freehm-core = { path = "../freehm-core" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
libloading = "0.9"
fontdb = "0.24"
sha2 = "0.10"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_Graphics_Direct3D",
]

[target.'cfg(target_os = "linux")'.dependencies]
# x11rb 0.13 is the version winit (eframe) already links, so it is not duplicated.
x11rb = { version = "0.13", features = ["shape", "randr"] }
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
rustix = { version = "1.1", features = ["event", "pipe", "fs", "net", "process"] }
# No tokio: ksni and zbus run on async-io in their own threads.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Certificates come from the system; ureq's own `rustls` feature would bundle a root list.
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[build-dependencies]
winresource = "0.1"

# `cargo deb -p freehm` (Linux). Paths are relative to this crate.
[package.metadata.deb]
name = "freehm"
maintainer = "VVVULTURE <VVVULTURE@users.noreply.github.com>"
copyright = "2026 VVVULTURE and FreeHM contributors"
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "pkexec"
extended-description = """\
Lightweight hardware statistics overlay for games: CPU/GPU utilisation, temperature, \
clock and power, RAM and VRAM. Uses documented kernel and driver interfaces only and \
never injects into games. Overlay via Wayland layer-shell or X11."""
maintainer-scripts = "../../packaging/linux/debian/"
assets = [
    ["target/release/freehm", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.vvvulture.FreeHM.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/freehm.png", "usr/share/icons/hicolor/256x256/apps/io.github.vvvulture.FreeHM.png", "644"],
    ["../../README.md", "usr/share/doc/freehm/", "644"],
    ["../../THIRD_PARTY_NOTICES.md", "usr/share/doc/freehm/", "644"],
    ["../../LICENSE", "usr/share/doc/freehm/", "644"],
    ["../../assets/fonts/OFL-Exo2.txt", "usr/share/doc/freehm/", "644"],
]
