name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline first and publishes its artifacts.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (build, test, installer, end-to-end)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Unit tests
        run: cargo test --workspace
      - name: Release build
        run: |
          cargo build --release --workspace
          cargo build --release -p freehm-helper --example present_loop
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party license list
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo about generate about.hbs -o dist/THIRD_PARTY_LICENSES.html
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'freehm' | Select-Object -ExpandProperty version
          & $iscc "/DAppVersion=$v" "/DBinDir=..\..\target\release" installer\windows\freehm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: End-to-end (overlay, click-through, shortcut, helper service)
        shell: pwsh
        run: ./tools/ci/windows-smoke-test.ps1 -Bin target\release -Out ci-out -Helper
      - name: Accuracy check (FreeHM vs independent sources, real sensors)
        shell: pwsh
        run: |
          $env:FREEHM_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "freehm-accuracy"
          New-Item -ItemType Directory -Force $env:FREEHM_CONFIG_DIR, ci-out | Out-Null
          '{"schema_version":1,"general":{"start_with_system":false},"permissions":{"first_run_done":true}}' | Set-Content "$env:FREEHM_CONFIG_DIR\config.json"
          Start-Process target/release/freehm.exe -ArgumentList '--background'
          Start-Sleep -Seconds 3
          ./tools/verify/accuracy.ps1 -Samples 30 -Load -Json ci-out/accuracy-windows.json
          $code = $LASTEXITCODE
          & target/release/freehm.exe --quit | Out-String | Out-Null
          exit $code
      - name: Installer silent install / uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\FreeHM-*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=helper','/LOG=ci-out\install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $app = "$env:ProgramFiles\FreeHM"
          foreach ($f in 'freehm.exe','freehm-helper.exe','LICENSE.txt','THIRD_PARTY_NOTICES.md','licenses\OFL-Exo2.txt','licenses\PawnIO-modules-LGPL-2.1.txt','licenses\THIRD_PARTY_LICENSES.html') {
            if (-not (Test-Path "$app\$f")) { throw "missing $f" }
          }
          Get-Service FreeHMHelper | Format-List Name, Status, StartType
          $un = "$app\unins000.exe"
          $p = Start-Process $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Get-Service FreeHMHelper -ErrorAction SilentlyContinue) { throw "helper service left behind" }
          if (Test-Path "$app\freehm.exe") { throw "files left behind" }
          Write-Host "PASS: installer installs files + helper service and uninstalls them"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-test-output
          path: ci-out
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: dist/*.exe
      - name: Portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/licenses | Out-Null
          Copy-Item target/release/freehm.exe, target/release/freehm-helper.exe, README.md, THIRD_PARTY_NOTICES.md portable/
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item assets/fonts/OFL-Exo2.txt, dist/THIRD_PARTY_LICENSES.html portable/licenses/
          Copy-Item crates/freehm-helper/modules/COPYING.LGPL-2.1 portable/licenses/PawnIO-modules-LGPL-2.1.txt
      - uses: actions/upload-artifact@v5
        with:
          name: windows-binaries
          path: portable

  linux:
    name: Linux (build, test, packages, X11 + Wayland end-to-end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils xdotool xterm imagemagick sway grim jq dbus dbus-x11 desktop-file-utils
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Unit tests
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p freehm
      - name: End-to-end (X11 via Xvfb, Wayland via headless sway)
        run: bash tools/ci/linux-overlay-test.sh target/release/freehm ci-out
      - name: Accuracy check (FreeHM vs independent sources, real sensors)
        run: |
          set -euo pipefail
          export FREEHM_CONFIG_DIR; FREEHM_CONFIG_DIR=$(mktemp -d)
          export XDG_CONFIG_HOME; XDG_CONFIG_HOME=$(mktemp -d)
          export DISPLAY=:98 XDG_SESSION_TYPE=x11; unset WAYLAND_DISPLAY
          echo '{"schema_version":1,"general":{"start_with_system":false},"permissions":{"first_run_done":true}}' > "$FREEHM_CONFIG_DIR/config.json"
          Xvfb :98 -screen 0 1280x720x24 & XVFB=$!
          for _ in $(seq 50); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.2; done
          dbus-run-session -- target/release/freehm --background & APP=$!
          for _ in $(seq 50); do target/release/freehm --status >/dev/null 2>&1 && break; sleep 0.2; done
          mkdir -p ci-out
          code=0; python3 tools/verify/accuracy.py --samples 30 --load --json ci-out/accuracy-linux.json || code=$?
          target/release/freehm --quit || true
          wait "$APP" || true; kill "$XVFB" || true
          exit $code
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-deb
      - name: Packages (.deb, AppImage)
        run: |
          set -euo pipefail
          mkdir -p dist
          desktop-file-validate packaging/linux/io.github.vvvulture.FreeHM.desktop
          cargo about generate about.hbs -o dist/THIRD_PARTY_LICENSES.html
          cargo deb -p freehm --no-build -o dist/
          dpkg-deb --contents dist/*.deb
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="freehm") | .version')
          A=AppDir
          install -Dm755 target/release/freehm $A/usr/bin/freehm
          install -Dm644 packaging/linux/io.github.vvvulture.FreeHM.desktop $A/usr/share/applications/io.github.vvvulture.FreeHM.desktop
          install -Dm644 packaging/linux/io.github.vvvulture.FreeHM.desktop $A/io.github.vvvulture.FreeHM.desktop
          install -Dm644 assets/icons/freehm.png $A/usr/share/icons/hicolor/256x256/apps/io.github.vvvulture.FreeHM.png
          install -Dm644 assets/icons/freehm.png $A/io.github.vvvulture.FreeHM.png
          for f in README.md LICENSE THIRD_PARTY_NOTICES.md assets/fonts/OFL-Exo2.txt dist/THIRD_PARTY_LICENSES.html; do install -Dm644 "$f" "$A/usr/share/doc/freehm/$(basename "$f")"; done
          ln -sf usr/bin/freehm $A/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $A "dist/FreeHM-$V-x86_64.AppImage"
          "dist/FreeHM-$V-x86_64.AppImage" --appimage-extract-and-run --version
          ls -l dist
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux-test-output
          path: ci-out
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
      - name: Portable files
        run: |
          mkdir -p portable/licenses
          cp target/release/freehm README.md LICENSE THIRD_PARTY_NOTICES.md portable/
          cp assets/fonts/OFL-Exo2.txt dist/THIRD_PARTY_LICENSES.html portable/licenses/
      - uses: actions/upload-artifact@v5
        with:
          name: linux-binaries
          path: portable
