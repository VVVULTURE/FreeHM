name: Release

# Builds FreeHM for Windows 11 (x64) and Linux (x86_64) and publishes a GitHub release.
#
# - Raise `version` in the workspace Cargo.toml and push to main: when it is above every
#   existing tag, release X.Y.Z is published and tagged `vX.Y.Z`. Other pushes publish nothing.
#   A version with a suffix (`0.2.0-rc1`) becomes a pre-release, which the updater ignores.
# - Run it by hand (Actions > Release > Run workflow) for a dry run: everything is built
#   and tested and the files are kept as workflow artifacts, but nothing is published.
#
# Nothing is published unless the full CI pipeline passes first: build, unit tests,
# end-to-end tests on both systems and the accuracy check against independent sources.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two quick pushes must not both publish: the second sees the first one's tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="freehm") | .version')
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::could not read the app version (got '$V')"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          python3 tools/ci/should-publish.py --self-test
          PUBLISH=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            PUBLISH=$(git ls-remote --tags --refs origin 'v*' | python3 tools/ci/should-publish.py "$V")
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "FreeHM $V, publish: $PUBLISH"

  ci:
    name: CI
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  package:
    name: Release files and checksums
    needs: [version, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          set -euo pipefail
          V=${{ needs.version.outputs.version }}
          mkdir -p release
          cp artifacts/windows-installer/*.exe release/
          cp artifacts/linux-packages/*.deb artifacts/linux-packages/*.AppImage release/
          # Plain Linux binary archive for distributions without .deb or AppImage support.
          mkdir -p "FreeHM-$V-linux-x86_64"
          cp -r artifacts/linux-binaries/. "FreeHM-$V-linux-x86_64/"
          chmod +x "FreeHM-$V-linux-x86_64/freehm"
          tar -czf "release/FreeHM-$V-linux-x86_64.tar.gz" "FreeHM-$V-linux-x86_64"
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release; cat release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: release/*

  publish:
    name: Publish GitHub release
    if: needs.version.outputs.publish == 'true'
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FreeHM v${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            **Windows 11 (x64):** `FreeHM-${{ needs.version.outputs.version }}-windows-x64-setup.exe` (installer; run as administrator to also install the optional helper service for FPS and CPU temperature).
            **Linux (x86_64):** the `.deb`, the AppImage, or the plain `.tar.gz`.
            Verify downloads against `SHA256SUMS.txt`.
          files: release/*
